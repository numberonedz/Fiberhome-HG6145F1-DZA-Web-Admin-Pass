<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiberhome HG6145F1 — Web Password Generator</title>
<style>
  :root {    
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f0f0f2;
    
    --border: #d1d1d6;
    --border-active: #a1a1aa; 
        
    --accent: #059669;
    --accent-dim: rgba(5, 150, 105, 0.08);
    --accent-glow: rgba(5, 150, 105, 0.15);

    --text-muted: #71717a;

    --mono: 'Courier New', Courier, monospace;

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .shell {
    width: 100%;
    max-width: 600px;
  }

  .header {
    margin-bottom: 2.5rem;
  }

  h1 {
    font-size: clamp(18px, 4vw, 24px);
    font-weight: normal;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: var(--text);
    margin-bottom: 0.5rem;
    text-align:center;
  }

  h1 span { color: var(--accent); }

  .meta {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-align:center;
    gap: 1.2rem;
  }

  .meta span::before {
    content: '// ';
    color: var(--text-muted);
    opacity: 0.8;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }

  .field-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
    display: block;
    font-weight: bold;
  }

  .input-wrap {
    position: relative;
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: 0.08em;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
  }

  input[type="text"]::placeholder { color: var(--text-muted); opacity: 0.7; }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  input[type="text"].error { border-color: var(--error); box-shadow: 0 0 0 3px var(--error-dim); }
  input[type="text"].success { border-color: var(--accent); }

  .btn-generate {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #ffffff;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px 18px;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .btn-generate:hover { opacity: 0.9; }
  .btn-generate:active { transform: scale(0.97); }

  .error-msg {
    display: none;
    font-size: 12px;
    color: var(--error);
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  .error-msg.visible { display: flex; align-items: center; gap: 6px; }

  .retry-indicator {
    display: none;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.05em;
  }
  .retry-indicator.visible { display: block; }
  .retry-dot { color: var(--error); }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    display: none;
    animation: fadeIn 0.25s ease;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }

  .result-card.visible { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1rem;
  }

  .password-display {
    font-size: clamp(20px, 5vw, 28px);
    letter-spacing: 0.12em;
    color: var(--accent);
    word-break: break-all;
    margin-bottom: 1.25rem;
    line-height: 1.4;
    cursor: pointer;
    transition: opacity 0.15s;
    user-select: all;
  }

  .password-display:hover { opacity: 0.7; }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn-secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 8px 14px;
    transition: all 0.15s;
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .btn-secondary:active { transform: scale(0.97); }

  .copy-feedback {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.05em;
    display: none;
    align-items: center;
    gap: 5px;
    animation: fadeIn 0.15s ease;
  }
  .copy-feedback.visible { display: flex; }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.05em;
    line-height: 1.7;
    padding: 12px 14px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 10px;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-muted); }

  .export-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .footer {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    opacity: 0.7;
    text-align: center;
    margin-top: 2rem;
  }

  .strength-bar {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin: 0 0 1.25rem;
    overflow: hidden;
  }

  .strength-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.4s ease;
  }
</style></head>
<body>

<div class="shell">

</div>

<script>

    a=gg(a,b,c,d,w[i+5],5,-701558691);   d=gg(d,a,b,c,w[i+10],9,38016083);    c=gg(c,d,a,b,w[i+15],14,-660478335);  b=gg(b,c,d,a,w[i+4],20,-405537848);

    a=gg(a,b,c,d,w[i+13],5,-1444681467); d=gg(d,a,b,c,w[i+2],9,-51403784);    c=gg(c,d,a,b,w[i+7],14,1735328473);   b=gg(b,c,d,a,w[i+12],20,-1926607734);
    a=hh(a,b,c,d,w[i+5],4,-378558);      d=hh(d,a,b,c,w[i+8],11,-2022574463); c=hh(c,d,a,b,w[i+11],16,1839030562);  b=hh(b,c,d,a,w[i+14],23,-35309556);

  function hex(n){var s='';for(var j=0;j<4;j++)s+=('0'+((n>>>(j*8))&0xFF).toString(16)).slice(-2);return s;}
  return hex(a)+hex(b)+hex(c)+hex(d);

var UPPER  = "ACDFGHJMNPRSTUWXY";
var LOWER  = "abcdfghjkmpstuwxy";
var DIGIT  = "2345679";
var SYMBOL = "!@$&%";
var MAC_RE = /^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$/;

function normalizeMac(raw) {
  var clean = raw.replace(/[:\-.]/g, "").toUpperCase();
  if (clean.length === 12 && /^[0-9A-F]+$/.test(clean)) {
    return clean.match(/.{2}/g).join(":");
  }
  return raw;
}

function validateMac(mac) { return MAC_RE.test(mac); }

function macToPass(mac) {
  var digest = MD5(mac + "AEJLY");
  var vals = [];
  for (var i = 0; i < 20; i++) {
    var c = digest[i];
    if (c >= '0' && c <= '9') vals.push(c.charCodeAt(0) - 48);
    else vals.push(c.charCodeAt(0) - 87);
  }
  var password = new Array(16).fill('');
  for (var i = 0; i < 16; i++) {
    var v = vals[i], t = v % 4;
    if (t === 0) password[i] = UPPER[(v * 2) % 17];
    else if (t === 1) password[i] = LOWER[(v * 2 + 1) % 17];
    else if (t === 2) password[i] = DIGIT[6 - (v % 7)];
    else              password[i] = SYMBOL[4 - (v % 5)];
  }
  function nextFree(start, taken) {
    var p = start % 16;
    while (taken.has(p)) p = (p + 1) % 16;
    return p;
  }
  var taken = new Set();
  var p0 = nextFree(vals[16] + 1, taken); taken.add(p0);
  var p1 = nextFree(vals[17] + 1, taken); taken.add(p1);
  var p2 = nextFree(vals[18] + 1, taken); taken.add(p2);
  var p3 = nextFree(vals[19] + 1, taken);
  password[p0] = UPPER[(vals[16] * 2) % 17];
  password[p1] = LOWER[(vals[17] * 2 + 1) % 17];
  password[p2] = DIGIT[6 - (vals[18] % 7)];
  password[p3] = SYMBOL[4 - (vals[19] % 5)];
  return password.join('');
}

var lastPassword = '';

var input      = document.getElementById('mac-input');
var btnGen     = document.getElementById('btn-gen');
var errorMsg   = document.getElementById('error-msg');
var errorText  = document.getElementById('error-text');
var retryEl    = document.getElementById('retry-indicator');
var retryText  = document.getElementById('retry-text');
var resultCard = document.getElementById('result-card');
var pwDisplay  = document.getElementById('pw-display');
var statLen    = document.getElementById('stat-len');
var statClass  = document.getElementById('stat-classes');
var btnCopy    = document.getElementById('btn-copy');
var btnReset   = document.getElementById('btn-reset');
var copyFb     = document.getElementById('copy-feedback');

function countClasses(pw) {
  var u = /[A-Z]/.test(pw), l = /[a-z]/.test(pw),
      d = /[0-9]/.test(pw), s = /[!@$&%]/.test(pw);
  return [u,l,d,s].filter(Boolean).length;
}

function showResult(pw) {
  lastPassword = pw;
  pwDisplay.textContent = pw;
  resultCard.classList.add('visible');
  input.classList.remove('error');
  input.classList.add('success');
  errorMsg.classList.remove('visible');
  retryEl.classList.remove('visible');
  retries = 0;
}

function showError(msg) {
  input.classList.add('error');
  input.classList.remove('success');
  errorText.textContent = msg;
  errorMsg.classList.add('visible');
}

function generate() {
  var raw = input.value.trim();
  var mac = normalizeMac(raw);
  if (!validateMac(mac)) {
    showError('Invalid format — expected XX:XX:XX:XX:XX:XX');
    input.focus();
    return;
  }
  showResult(macToPass(mac.toUpperCase()));
}

btnGen.addEventListener('click', generate);
input.addEventListener('keydown', function(e) { if (e.key === 'Enter') generate(); });

input.addEventListener('input', function() {
  input.classList.remove('error', 'success');
  errorMsg.classList.remove('visible');
});

/* Auto-insert colons */
input.addEventListener('input', function(e) {
  var v = input.value.replace(/[^0-9A-Fa-f:]/g, '');
  var digits = v.replace(/:/g, '');
  if (digits.length > 12) digits = digits.slice(0, 12);
  var formatted = digits.match(/.{1,2}/g);
  if (formatted) {
    var joined = formatted.join(':');
    if (v.endsWith(':') && joined.length < 17) joined += '';
    input.value = joined;
  } else {
    input.value = '';
  }
});

btnCopy.addEventListener('click', function() {
  if (!lastPassword) return;
  navigator.clipboard.writeText(lastPassword).then(function() {
    copyFb.classList.add('visible');
    setTimeout(function() { copyFb.classList.remove('visible'); }, 2000);
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = lastPassword;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    copyFb.classList.add('visible');
    setTimeout(function() { copyFb.classList.remove('visible'); }, 2000);
  });
});

btnReset.addEventListener('click', function() {
  input.value = '';
  input.classList.remove('error', 'success');
  errorMsg.classList.remove('visible');
  retryEl.classList.remove('visible');
  resultCard.classList.remove('visible');
  lastPassword = '';
  input.focus();
});
</script>
